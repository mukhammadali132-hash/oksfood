      padding: 0;
    }

      background: linear-gradient(135deg, #f3e8df 0%, #f5efe6 45%, #d6efe2 100%);

    }
    .no-scrollbar {
      -ms-overflow-style: none;

            img: "https://images.unsplash.com/photo-1645112411341-6c4fd023714a?w=500&auto=format&fit=crop&q=60"
          },
          {
            meal: "Обед 4",
            name: { ru: "Запеченный лосось с рисом и овощами", uz: "Guruch va sabzavotli pishirilgan losos" },
            desc: { ru: "48 000 сум • 540 ккал", uz: "48 000 so'm • 540 kkal" },
            img: "https://images.unsplash.com/photo-1467003909585-2f8a72700288?w=500&auto=format&fit=crop&q=60"
          }
        ]
      }
    };

    function setLanguage(lang) {
      currentLang = lang;
      localStorage.setItem('oks_lang', lang);

      document.getElementById('lang-ru').className = lang === 'ru'
        ? 'px-2.5 sm:px-3 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-zinc-900 text-white transition'
        : 'px-2.5 sm:px-3 py-1 text-[11px] sm:text-xs font-bold rounded-full text-zinc-700 transition';
      document.getElementById('lang-uz').className = lang === 'uz'
        ? 'px-2.5 sm:px-3 py-1 text-[11px] sm:text-xs font-bold rounded-full bg-zinc-900 text-white transition'
        : 'px-2.5 sm:px-3 py-1 text-[11px] sm:text-xs font-bold rounded-full text-zinc-700 transition';

      const t = uiTranslations[lang];
      document.getElementById('subtitle-text').innerText = t.subtitle;
      document.getElementById('search-input').placeholder = t.searchPlaceholder;
      document.getElementById('categories-title').innerText = t.categoriesTitle;
      document.getElementById('modal-order-btn').innerText = t.modalOrderDishBtn;

      Object.keys(t.programs).forEach(progKey => {
        const btn = document.getElementById(`btn-${progKey}`);
        if (btn) {
          btn.querySelector('.btn-label').innerText = t.programs[progKey];
        }
      });

      changeProgram(currentProgram);
    }

    function changeProgram(programName) {
      currentProgram = programName;
      document.querySelectorAll('.prog-btn').forEach(btn => {
        btn.classList.remove('bg-zinc-900', 'text-white', 'shadow-sm');
        btn.classList.add('glass-pill', 'text-zinc-800');
      });
      const activeBtn = document.getElementById(`btn-${programName}`);
      activeBtn.classList.remove('glass-pill', 'text-zinc-800');
      activeBtn.classList.add('bg-zinc-900', 'text-white', 'shadow-sm');

      const data = menusData[programName];
      const t = uiTranslations[currentLang];
      const localizedProgName = t.programs[programName];
      const isSingleDish = Boolean(data.isSingleDishOrder);

      document.getElementById('active-prog-icon').innerText = programIcons[programName] || '🥗';
      document.getElementById('active-prog-title').innerText = localizedProgName;
      document.getElementById('ration-badge').innerText = isSingleDish ? t.lunchBadge : t.rationBadge;
      document.getElementById('text-kbju').innerText = data.kbju[currentLang];

      const programOrderBtn = document.getElementById('program-order-btn');
      if (isSingleDish) {
        programOrderBtn.classList.add('hidden');
        tg.MainButton.text = t.orderLunchMainBtn;
      } else {
        programOrderBtn.classList.remove('hidden');
        const orderText = t.orderProgramBtn(localizedProgName);
        programOrderBtn.innerText = orderText;
        tg.MainButton.text = orderText;
      }

      renderDishes();
    }

    function renderDishes() {
      const data = menusData[currentProgram];
      const t = uiTranslations[currentLang];
      const isSingleDish = Boolean(data.isSingleDishOrder);
      const query = document.getElementById('search-input').value.trim().toLowerCase();
      const container = document.getElementById('menu-container');
      container.innerHTML = '';

      const filteredDishes = data.dishes.filter(item => {
        const dishName = (typeof item.name === 'object' ? item.name[currentLang] : item.name).toLowerCase();
        const mealLabel = (t.meals[item.meal] || item.meal).toLowerCase();
        return dishName.includes(query) || mealLabel.includes(query);
      });

      if (filteredDishes.length === 0) {
        container.innerHTML = `<div class="col-span-full text-center py-8 text-xs sm:text-sm font-semibold text-zinc-500">${t.emptySearch}</div>`;
        return;
      }

      filteredDishes.forEach((item) => {
        const mealLabel = t.meals[item.meal] || item.meal;
        const dishName = typeof item.name === 'object' ? item.name[currentLang] : item.name;
        const dishDesc = typeof item.desc === 'object' ? item.desc[currentLang] : item.desc;

        const card = document.createElement('div');
        card.className = "dish-card rounded-2xl sm:rounded-3xl p-2 sm:p-2.5 flex flex-col justify-between min-w-0 transition active:scale-[0.98] cursor-pointer";
        card.onclick = () => openModal(item.img, mealLabel, dishName, dishDesc, isSingleDish);

        const bottomActionHtml = isSingleDish
          ? `<div class="px-1 pb-0.5 flex items-center justify-between gap-1.5 min-w-0">
               <span class="text-[11px] sm:text-xs font-extrabold text-emerald-700 leading-tight break-words">${dishDesc}</span>
               <button type="button" onclick="orderSingleDish(event)" class="w-7 h-7 sm:w-8 sm:h-8 flex-shrink-0 rounded-full bg-zinc-900 text-white flex items-center justify-center text-sm font-bold shadow-sm active:scale-90 transition">+</button>
             </div>`
          : `<div class="px-1 pb-1 min-w-0">
               <span class="text-[11px] sm:text-xs font-extrabold text-emerald-700 break-words">${dishDesc}</span>
             </div>`;

        card.innerHTML = `
          <div class="min-w-0">
            <div class="relative mb-2">
              <img src="${item.img}" alt="${dishName}" loading="lazy" class="w-full aspect-[4/3] rounded-xl sm:rounded-2xl object-cover">
            </div>
            <div class="px-1 min-w-0">
              <div class="text-xs sm:text-sm font-extrabold text-zinc-900 leading-snug line-clamp-2 mb-0.5 break-words">${dishName}</div>
              <div class="text-[10px] sm:text-[11px] font-medium text-zinc-500 mb-2 truncate">${mealLabel}</div>
            </div>
          </div>
          ${bottomActionHtml}
        `;
        container.appendChild(card);
      });
    }

    function openModal(img, meal, name, desc, showOrderBtn) {
      document.getElementById('modal-img').src = img;
      document.getElementById('modal-meal').innerText = meal;
      document.getElementById('modal-name').innerText = name;
      document.getElementById('modal-desc').innerText = desc;

      const modalOrderBtn = document.getElementById('modal-order-btn');
      if (showOrderBtn) {
        modalOrderBtn.classList.remove('hidden');
      } else {
        modalOrderBtn.classList.add('hidden');
      }

      const modal = document.getElementById('dish-modal');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
    }

    function hideModal() {
      const modal = document.getElementById('dish-modal');
      modal.classList.add('hidden');
      modal.classList.remove('flex');
    }

    function closeModal(e) {
      if (e.target.id === 'dish-modal') hideModal();
    }

    function orderCurrentProgram() {
      tg.openTelegramLink("https://t.me/Ermatov2012");
    }

    function orderSingleDish(e) {
      e.stopPropagation();
      tg.openTelegramLink("https://t.me/Ermatov2012");
    }

    function orderSingleDishFromModal() {
      hideModal();
      tg.openTelegramLink("https://t.me/Ermatov2012");
    }

    async function loadUpdatesFromServer() {
      try {
        const res = await fetch(API_URL, {
          headers: { "ngrok-skip-browser-warning": "true" }
        });
        const data = await res.json();

        if (data.dishes && Array.isArray(data.dishes)) {
          data.dishes.forEach(updated => {
            const prog = menusData[updated.program];
            if (prog) {
              const target = prog.dishes.find(d => d.meal === updated.meal);
              if (target) {
                target.name = {
                  ru: updated.name_ru || updated.name,
                  uz: updated.name_uz || updated.name_ru || updated.name
                };
                target.desc = {
                  ru: updated.desc_ru || updated.desc,
                  uz: updated.desc_uz || updated.desc_ru || updated.desc
                };
                target.img = updated.img;
              }
            }
          });
          changeProgram(currentProgram);
        }
      } catch (e) {
        console.log("Сервер недоступен, отображаем локальное меню:", e);
      }
    }

    const savedLang = localStorage.getItem('oks_lang') || 'ru';
    setLanguage(savedLang);
    loadUpdatesFromServer();

    tg.MainButton.textColor = "#ffffff";
    tg.MainButton.color = "#18181b";
    tg.MainButton.show();
    tg.MainButton.onClick(() => {
      orderCurrentProgram();
    });
  </script>
</body>
</html>
