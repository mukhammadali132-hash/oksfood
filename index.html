<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OKS-FOOD — Здоровое питание</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        @keyframes pulseGlow {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(52, 211, 153, 0.4)); }
            50% { filter: drop-shadow(0 0 25px rgba(52, 211, 153, 0.7)); }
        }
        .logo-glow {
            animation: pulseGlow 3s infinite ease-in-out;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-950 via-slate-900 to-emerald-950 text-slate-100 min-h-screen flex flex-col font-sans">
    
    <!-- Шапка с крупным логотипом и ссылкой на канал меню -->
    <header class="p-5 bg-slate-900/85 backdrop-blur-md border-b border-slate-800 text-center sticky top-0 z-20 shadow-xl flex flex-col items-center justify-center">
        <div class="flex items-center gap-3 logo-glow mb-1">
            <img src="logo.png" alt="OKS-FOOD Logo" class="w-14 h-14 object-contain rounded-2xl border border-emerald-500/30 bg-slate-800 p-1 shadow-lg" onerror="this.style.display='none'">
            <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-400 via-teal-300 to-emerald-500">OKS-FOOD</h1>
        </div>
        <p class="text-xs text-slate-400 tracking-wide mb-3">Премиальное сбалансированное питание с доставкой</p>
        <a href="https://t.me/oks_fooduz" target="_blank" onclick="openChannel(event)" class="inline-flex items-center gap-2 text-xs font-bold bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-300 border border-emerald-500/30 px-4 py-2 rounded-full transition">
            <span>📢 Канал с меню (@oks_fooduz)</span>
            <span>➔</span>
        </a>
    </header>

    <!-- Основной контент -->
    <main class="flex-1 max-w-md w-full mx-auto p-4 pb-28">
        
        <!-- Шаг 1: Выбор тарифа -->
        <div id="programs-section">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3 px-1">Выберите программу питания:</h2>
            <div id="programs-container" class="space-y-3">
                <div class="text-center py-10 text-emerald-400 animate-pulse">Загрузка актуального меню...</div>
            </div>
        </div>

        <!-- Шаг 2: Выбор калорийности -->
        <div id="tiers-section" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-slate-800/90 border border-slate-700 p-4 rounded-2xl shadow-xl">
                <div>
                    <span class="text-xs text-emerald-400 font-medium uppercase tracking-wider">Выбранный тариф:</span>
                    <h2 id="selected-program-title" class="text-lg font-bold text-white"></h2>
                </div>
                <button onclick="backToPrograms()" class="text-xs bg-slate-700 hover:bg-slate-600 px-3 py-2 rounded-xl transition border border-slate-600 text-slate-300">
                    ⬅️ Назад
                </button>
            </div>

            <h3 class="text-sm font-semibold uppercase tracking-wider text-slate-400 px-1 pt-2">Выберите суточную калорийность и КБЖУ:</h3>
            <div id="tiers-container" class="space-y-3"></div>
        </div>
    </main>

    <!-- Плавающая панель заказа -->
    <div id="order-bar" class="hidden fixed bottom-0 left-0 right-0 bg-slate-900/95 backdrop-blur-lg border-t border-slate-800 p-4 shadow-2xl z-30 transition-all duration-300">
        <div class="max-w-md mx-auto flex items-center justify-between gap-3">
            <div class="overflow-hidden">
                <div class="text-[10px] text-slate-400 uppercase tracking-wider">Ваш выбор:</div>
                <div id="selected-summary" class="font-bold text-emerald-400 text-xs truncate"></div>
            </div>
            <button onclick="openOrderModal()" class="bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black px-6 py-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 transition transform active:scale-95 shrink-0 flex items-center gap-2">
                <span>Заказать</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>
        </div>
    </div>

    <!-- Модальное окно формы заказа -->
    <div id="order-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-40 flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-slate-900 border border-slate-700 w-full max-w-md rounded-t-3xl sm:rounded-3xl p-5 shadow-2xl space-y-4">
            <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                <div>
                    <h3 class="text-lg font-bold text-white">Оформление заказа</h3>
                    <p id="modal-tariff-info" class="text-xs text-emerald-400 font-medium"></p>
                </div>
                <button onclick="closeOrderModal()" class="w-8 h-8 rounded-full bg-slate-800 text-slate-400 hover:text-white flex items-center justify-center">✕</button>
            </div>

            <form id="order-form" onsubmit="submitOrderForm(event)" class="space-y-3">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">1. Имя и фамилия *</label>
                    <input type="text" id="cust-name" required placeholder="Например: Алишер Каримов" class="w-full bg-slate-800 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">2. Номер телефона *</label>
                    <input type="tel" id="cust-phone" required placeholder="+998 90 123 45 67" class="w-full bg-slate-800 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">3. Точный адрес *</label>
                    <input type="text" id="cust-address" required placeholder="Район, улица, дом, квартира, ориентир" class="w-full bg-slate-800 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition">
                </div>

                <div>
                    <label class="block text-xs text-slate-400 mb-1">4. Геолокация *</label>
                    <div class="flex gap-2">
                        <input type="text" id="cust-geo" required placeholder="Ссылка на карту или нажмите кнопку ➔" class="flex-1 bg-slate-800 border border-slate-700 focus:border-emerald-500 rounded-xl px-3.5 py-2.5 text-sm text-white outline-none transition">
                        <button type="button" id="geo-btn" onclick="detectLocation()" class="bg-slate-800 hover:bg-slate-700 border border-emerald-500/40 text-emerald-400 px-3 py-2.5 rounded-xl text-xs font-semibold shrink-0 transition">
                            📍 Моя гео
                        </button>
                    </div>
                </div>

                <button type="submit" class="w-full mt-2 bg-gradient-to-r from-emerald-500 to-teal-400 hover:from-emerald-400 hover:to-teal-300 text-slate-950 font-black py-3.5 rounded-2xl shadow-lg shadow-emerald-500/20 transition transform active:scale-95">
                    Отправить менеджеру 🚀
                </button>
            </form>
        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        if (tg) {
            tg.expand();
        }

        const BACKEND_URL = "https://muhammadali123.pythonanywhere.com";
        const MANAGER_USERNAME = "OKSFOOD_manager";
        const CHANNEL_URL = "https://t.me/oks_fooduz";

        // Таблица КБЖУ по программам и калорийностям
        const KBJU_MAP = {
            "Баланс": {
                "800 ккал": "Б: 35–45 г • Ж: 25–30 г • У: 90–105 г",
                "700 - 800": "Б: 35–45 г • Ж: 25–30 г • У: 90–105 г",
                "1000 ккал": "Б: 45–55 г • Ж: 30–35 г • У: 110–130 г",
                "900 - 1000": "Б: 45–55 г • Ж: 30–35 г • У: 110–130 г",
                "1200 ккал": "Б: 55–65 г • Ж: 35–45 г • У: 135–155 г",
                "1100 - 1200": "Б: 55–65 г • Ж: 35–45 г • У: 135–155 г",
                "1200 - 1300": "Б: 55–65 г • Ж: 35–45 г • У: 135–155 г",
                "1600 ккал": "Б: 75–90 г • Ж: 45–55 г • У: 180–205 г",
                "1500 - 1600": "Б: 75–90 г • Ж: 45–55 г • У: 180–205 г",
                "2000 ккал": "Б: 95–110 г • Ж: 55–70 г • У: 225–255 г",
                "1800 - 2000": "Б: 95–110 г • Ж: 55–70 г • У: 225–255 г",
                "2000 - 2100": "Б: 95–110 г • Ж: 55–70 г • У: 225–255 г",
                "2500 ккал": "Б: 115–135 г • Ж: 70–85 г • У: 280–320 г",
                "2500 - 2600": "Б: 115–135 г • Ж: 70–85 г • У: 280–320 г"
            },
            "Кето": {
                "800 ккал": "Б: 40–50 г • Ж: 55–65 г • У: 10–15 г",
                "700 - 800": "Б: 40–50 г • Ж: 55–65 г • У: 10–15 г",
                "1000 ккал": "Б: 50–60 г • Ж: 70–80 г • У: 10–20 г",
                "900 - 1000": "Б: 50–60 г • Ж: 70–80 г • У: 10–20 г",
                "1200 ккал": "Б: 60–75 г • Ж: 80–100 г • У: 15–20 г",
                "1100 - 1200": "Б: 60–75 г • Ж: 80–100 г • У: 15–20 г",
                "1200 - 1300": "Б: 60–75 г • Ж: 80–100 г • У: 15–20 г",
                "1600 ккал": "Б: 85–105 г • Ж: 110–130 г • У: 20–30 г",
                "1500 - 1600": "Б: 85–105 г • Ж: 110–130 г • У: 20–30 г",
                "2000 ккал": "Б: 105–130 г • Ж: 140–165 г • У: 25–35 г",
                "1800 - 2000": "Б: 105–130 г • Ж: 140–165 г • У: 25–35 г",
                "2000 - 2100": "Б: 105–130 г • Ж: 140–165 г • У: 25–35 г",
                "2500 ккал": "Б: 130–155 г • Ж: 175–205 г • У: 30–40 г",
                "2500 - 2600": "Б: 130–155 г • Ж: 175–205 г • У: 30–40 г"
            },
            "Спорт": {
                "800 ккал": "Б: 40–50 г • Ж: 20–25 г • У: 90–105 г",
                "700 - 800": "Б: 40–50 г • Ж: 20–25 г • У: 90–105 г",
                "1000 ккал": "Б: 50–65 г • Ж: 25–30 г • У: 110–130 г",
                "900 - 1000": "Б: 50–65 г • Ж: 25–30 г • У: 110–130 г",
                "1200 ккал": "Б: 65–80 г • Ж: 30–35 г • У: 135–155 г",
                "1100 - 1200": "Б: 65–80 г • Ж: 30–35 г • У: 135–155 г",
                "1200 - 1300": "Б: 65–80 г • Ж: 30–35 г • У: 135–155 г",
                "1600 ккал": "Б: 90–110 г • Ж: 40–50 г • У: 180–205 г",
                "1500 - 1600": "Б: 90–110 г • Ж: 40–50 г • У: 180–205 г",
                "2000 ккал": "Б: 115–135 г • Ж: 50–65 г • У: 225–255 г",
                "1800 - 2000": "Б: 115–135 г • Ж: 50–65 г • У: 225–255 г",
                "2000 - 2100": "Б: 115–135 г • Ж: 50–65 г • У: 225–255 г",
                "2500 ккал": "Б: 140–165 г • Ж: 65–80 г • У: 280–320 г",
                "2500 - 2600": "Б: 140–165 г • Ж: 65–80 г • У: 280–320 г"
            }
        };

        function getKbju(programTitle, kcalValue) {
            const cleanKcal = String(kcalValue || "").replace(/ккал/gi, "").trim();
            const progMap = KBJU_MAP[programTitle] || KBJU_MAP[programTitle?.split(" ")[0]] || {};
            return progMap[kcalValue] || progMap[cleanKcal] || "";
        }

        function openChannel(event) {
            if (tg && tg.openTelegramLink) {
                event.preventDefault();
                tg.openTelegramLink(CHANNEL_URL);
            }
        }

        let menuData = [];
        let selectedProgram = null;
        let selectedTier = null;

        async function fetchMenu() {
            try {
                const res = await fetch(`${BACKEND_URL}/api/menu`);
                const data = await res.json();
                menuData = data.programs || [];
                renderPrograms();
            } catch (err) {
                document.getElementById('programs-container').innerHTML = `
                    <div class="text-center py-8 bg-red-950/40 border border-red-900/50 rounded-2xl p-4">
                        <p class="text-red-400 text-sm font-semibold">Не удалось загрузить данные.</p>
                        <p class="text-xs text-slate-400 mt-1">Проверьте соединение с сервером.</p>
                    </div>`;
            }
        }

        function renderPrograms() {
            const container = document.getElementById('programs-container');
            container.innerHTML = '';

            menuData.forEach(prog => {
                const card = document.createElement('div');
                card.className = "bg-slate-900/80 border border-slate-800 hover:border-emerald-500/50 p-4 rounded-2xl shadow-lg cursor-pointer transition-all duration-200 hover:scale-[1.01] group";
                card.onclick = () => selectProgram(prog.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <h3 class="text-base font-bold text-white group-hover:text-emerald-400 transition">${prog.title_ru}</h3>
                        <span class="text-xs bg-emerald-500/10 text-emerald-400 px-2.5 py-1 rounded-full font-semibold border border-emerald-500/20">Выбрать ➔</span>
                    </div>
                    <p class="text-xs text-slate-400 mt-2 leading-relaxed">${prog.desc_ru}</p>
                `;
                container.appendChild(card);
            });
        }

        function selectProgram(progId) {
            selectedProgram = menuData.find(p => p.id === progId);
            selectedTier = null;
            
            document.getElementById('order-bar').classList.add('hidden');
            document.getElementById('programs-section').classList.add('hidden');
            document.getElementById('tiers-section').classList.remove('hidden');

            document.getElementById('selected-program-title').innerText = selectedProgram.title_ru;
            const container = document.getElementById('tiers-container');
            container.innerHTML = '';

            selectedProgram.tiers.forEach(tier => {
                const kbjuText = getKbju(selectedProgram.title_ru, tier.kcal);
                const btn = document.createElement('button');
                btn.className = "w-full text-left bg-slate-900/80 hover:bg-slate-800 p-4 rounded-2xl flex justify-between items-center gap-3 transition-all border border-slate-800 hover:border-emerald-500/40 shadow-md group";
                btn.onclick = () => selectTier(tier, kbjuText, btn);
                btn.innerHTML = `
                    <div>
                        <div class="text-[11px] text-slate-400 uppercase tracking-wider">Калорийность</div>
                        <div class="font-bold text-white text-base mt-0.5 group-hover:text-emerald-400 transition">🔥 ${tier.kcal}</div>
                        ${kbjuText ? `<div class="text-[11px] text-teal-300/90 mt-1 font-medium">${kbjuText}</div>` : ''}
                    </div>
                    <div class="text-right shrink-0">
                        <div class="text-[11px] text-slate-400 uppercase tracking-wider">Цена за день</div>
                        <div class="text-emerald-400 font-extrabold text-base mt-0.5">${tier.price}</div>
                    </div>
                `;
                container.appendChild(btn);
            });
        }

        function selectTier(tier, kbjuText, btnElement) {
            document.querySelectorAll('#tiers-container button').forEach(b => {
                b.classList.remove('border-emerald-500', 'bg-slate-800', 'shadow-emerald-500/10');
                b.classList.add('border-slate-800', 'bg-slate-900/80');
            });
            btnElement.classList.remove('border-slate-800', 'bg-slate-900/80');
            btnElement.classList.add('border-emerald-500', 'bg-slate-800', 'shadow-emerald-500/10');
            
            selectedTier = { ...tier, kbju: kbjuText };

            document.getElementById('selected-summary').innerText = `${selectedProgram.title_ru} | ${tier.kcal} — ${tier.price}`;
            document.getElementById('order-bar').classList.remove('hidden');
        }

        function backToPrograms() {
            selectedProgram = null;
            selectedTier = null;
            document.getElementById('tiers-section').classList.add('hidden');
            document.getElementById('programs-section').classList.remove('hidden');
            document.getElementById('order-bar').classList.add('hidden');
        }

        function openOrderModal() {
            if (!selectedProgram || !selectedTier) return;
            document.getElementById('modal-tariff-info').innerText = `${selectedProgram.title_ru} • ${selectedTier.kcal} (${selectedTier.price})`;
            
            const user = tg?.initDataUnsafe?.user;
            const nameInput = document.getElementById('cust-name');
            if (user && !nameInput.value) {
                nameInput.value = [user.first_name, user.last_name].filter(Boolean).join(' ');
            }

            document.getElementById('order-modal').classList.remove('hidden');
        }

        function closeOrderModal() {
            document.getElementById('order-modal').classList.add('hidden');
        }

        function detectLocation() {
            const btn = document.getElementById('geo-btn');
            const geoInput = document.getElementById('cust-geo');
            
            if (!navigator.geolocation) {
                alert('Геолокация не поддерживается вашим устройством. Вставьте ссылку вручную.');
                return;
            }

            btn.innerText = '⏳ Поиск...';
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lon = pos.coords.longitude.toFixed(6);
                    geoInput.value = `https://maps.google.com/?q=${lat},${lon}`;
                    btn.innerText = '✅ Готово';
                    btn.disabled = false;
                },
                (err) => {
                    alert('Не удалось получить доступ к GPS. Разрешите доступ к геопозиции в настройках или вставьте ссылку на карту вручную.');
                    btn.innerText = '📍 Моя гео';
                    btn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function submitOrderForm(event) {
            event.preventDefault();
            if (!selectedProgram || !selectedTier) return;

            const name = document.getElementById('cust-name').value.trim();
            const phone = document.getElementById('cust-phone').value.trim();
            const address = document.getElementById('cust-address').value.trim();
            const geo = document.getElementById('cust-geo').value.trim();
            const kbjuLine = selectedTier.kbju ? `\n📊 КБЖУ: ${selectedTier.kbju}` : '';

            const text = 
                `Здравствуйте! Хочу сделать заказ:\n\n` +
                `📦 Тариф: ${selectedProgram.title_ru}\n` +
                `🔥 Калорийность: ${selectedTier.kcal}${kbjuLine}\n` +
                `💰 Цена: ${selectedTier.price}\n\n` +
                `👤 Имя и фамилия: ${name}\n` +
                `📞 Телефон: ${phone}\n` +
                `🏠 Точный адрес: ${address}\n` +
                `📍 Геолокация: ${geo}\n\n` +
                `хочу узнать меню выбранного мною тарифа`;

            const url = `https://t.me/${MANAGER_USERNAME}?text=${encodeURIComponent(text)}`;
            
            closeOrderModal();

            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, '_blank');
            }
        }

        fetchMenu();
    </script>
</body>
</html>
