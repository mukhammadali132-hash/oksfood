<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>OKS-FOOD — Здоровое питание</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --brand-green: #528B37;
      --brand-green-dark: #3E6E28;
      --brand-green-light: #EAF4E6;
      --bg-color: #F4F7F3;
      --card-bg: #FFFFFF;
      --text-main: #1B2418;
      --text-muted: #647060;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      padding-bottom: 94px;
    }

    .header {
      background: #FFFFFF;
      padding: 14px 16px 16px;
      border-bottom-left-radius: 22px;
      border-bottom-right-radius: 22px;
      box-shadow: 0 4px 16px rgba(27, 36, 24, 0.06);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .logo-wrap img {
      height: 44px;
      width: auto;
      object-fit: contain;
      border-radius: 8px;
    }

    .lang-switch {
      display: flex;
      background: var(--bg-color);
      border-radius: 20px;
      padding: 3px;
    }

    .lang-btn {
      border: none;
      background: transparent;
      padding: 5px 11px;
      border-radius: 16px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
    }

    .lang-btn.active {
      background: var(--brand-green);
      color: #FFFFFF;
    }

    .programs-grid {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }
    .programs-grid::-webkit-scrollbar { display: none; }

    .prog-btn {
      flex: 0 0 auto;
      padding: 9px 15px;
      border-radius: 14px;
      border: 1.5px solid #DCE5D9;
      background: #FFFFFF;
      color: var(--text-main);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .prog-btn.active {
      background: var(--brand-green);
      border-color: var(--brand-green);
      color: #FFFFFF;
      box-shadow: 0 4px 10px rgba(82, 139, 55, 0.28);
    }

    .program-box {
      margin: 14px 16px 6px;
      padding: 14px 16px;
      background: #FFFFFF;
      border: 1px solid #DCE8D7;
      border-radius: 18px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.03);
    }

    .program-title {
      font-size: 17px;
      font-weight: 800;
      color: var(--brand-green-dark);
      margin-bottom: 4px;
    }

    .program-desc {
      font-size: 12.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
      line-height: 1.35;
    }

    .kcal-label {
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .tiers-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .tier-card {
      padding: 10px 12px;
      border-radius: 12px;
      border: 1.5px solid #E0E8DD;
      background: var(--bg-color);
      cursor: pointer;
      transition: 0.15s;
      text-align: left;
    }

    .tier-card.active {
      background: var(--brand-green-light);
      border-color: var(--brand-green);
      box-shadow: 0 2px 8px rgba(82, 139, 55, 0.18);
    }

    .tier-kcal {
      font-size: 13px;
      font-weight: 800;
      color: var(--text-main);
    }

    .tier-card.active .tier-kcal {
      color: var(--brand-green-dark);
    }

    .tier-price {
      font-size: 12px;
      font-weight: 600;
      color: var(--brand-green);
      margin-top: 2px;
    }

    .section-subtitle {
      margin: 14px 16px 4px;
      font-size: 13px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .dishes-list {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .dish-card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      gap: 12px;
      align-items: center;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    }

    .dish-img {
      width: 82px;
      height: 82px;
      border-radius: 14px;
      object-fit: cover;
      flex-shrink: 0;
      background: #E8EFE6;
    }

    .dish-info {
      flex: 1;
      min-width: 0;
    }

    .dish-meal {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--brand-green);
      margin-bottom: 3px;
    }

    .dish-name {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.25;
      margin-bottom: 5px;
    }

    .dish-desc {
      font-size: 12px;
      color: var(--text-muted);
    }

    .dish-price-row {
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .dish-price {
      font-size: 14px;
      font-weight: 800;
      color: var(--brand-green-dark);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-color);
      padding: 3px 6px;
      border-radius: 10px;
    }

    .qty-btn {
      width: 26px;
      height: 26px;
      border: none;
      border-radius: 8px;
      background: #FFFFFF;
      color: var(--brand-green-dark);
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .qty-val {
      font-size: 13px;
      font-weight: 700;
      min-width: 16px;
      text-align: center;
    }

    .bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 12px 16px 18px;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-top: 1px solid #E2EAE0;
      z-index: 30;
    }

    .order-btn {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #5BA03B 0%, #447A2B 100%);
      color: #FFFFFF;
      font-size: 15.5px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(82, 139, 55, 0.38);
      transition: transform 0.15s;
    }

    .order-btn:active {
      transform: scale(0.98);
    }

    .loader {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-top">
      <div class="logo-wrap">
        <img src="logo.png" alt="OKS FOOD" onerror="this.style.display='none'" />
      </div>
      <div class="lang-switch">
        <button class="lang-btn active" id="btn-ru" onclick="setLang('ru')">RU</button>
        <button class="lang-btn" id="btn-uz" onclick="setLang('uz')">UZ</button>
      </div>
    </div>
    <div class="programs-grid" id="programs-tabs"></div>
  </div>

  <div id="program-info"></div>
  <div class="section-subtitle" id="dishes-title">Пример меню на день</div>
  <div class="dishes-list" id="dishes-container">
    <div class="loader">Загрузка меню...</div>
  </div>

  <div class="bottom-bar">
    <button class="order-btn" id="order-btn" onclick="submitOrder()">Оформить заказ</button>
  </div>

  <script>
    const API_URL = "https://muhammadali123.pythonanywhere.com/api/menu";
    const tg = window.Telegram.WebApp;
    tg.expand();

    let lang = "ru";
    let menuData = { programs: [], dishes: [] };
    let currentProgram = "Баланс";
    let selectedTierIndex = 2;
    let cart = {};

    const i18n = {
      ru: {
        chooseKcal: "Выберите суточную калорийность:",
        menuExample: "Пример меню на день",
        lunchMenu: "Меню бизнес-ланча",
        orderProgram: "Оформить рацион",
        orderLunch: "Заказать бизнес-ланч",
        selectLunchHint: "Выберите блюда из списка",
        kcalUnit: "ккал"
      },
      uz: {
        chooseKcal: "Kunlik kaloriyani tanlang:",
        menuExample: "Kunlik menyu namunasi",
        lunchMenu: "Biznes-lanch menyusi",
        orderProgram: "Ratsionni buyurtma qilish",
        orderLunch: "Biznes-lanch buyurtma qilish",
        selectLunchHint: "Ro'yxatdan taomlarni tanlang",
        kcalUnit: "kkal"
      }
    };

    async function loadMenu() {
      try {
        const res = await fetch(API_URL);
        menuData = await res.json();
        if (menuData.programs.length > 0 && !menuData.programs.find(p => p.id === currentProgram)) {
          currentProgram = menuData.programs[0].id;
        }
        render();
      } catch (e) {
        document.getElementById("dishes-container").innerHTML =
          `<div class="loader">Ошибка загрузки меню. Проверьте соединение с сервером.</div>`;
      }
    }

    function setLang(newLang) {
      lang = newLang;
      document.getElementById("btn-ru").classList.toggle("active", lang === "ru");
      document.getElementById("btn-uz").classList.toggle("active", lang === "uz");
      render();
    }

    function selectProgram(progId) {
      currentProgram = progId;
      selectedTierIndex = 0;
      render();
    }

    function selectTier(idx) {
      selectedTierIndex = idx;
      render();
    }

    function changeQty(dishId, delta) {
      const next = (cart[dishId] || 0) + delta;
      if (next <= 0) delete cart[dishId];
      else cart[dishId] = next;
      render();
    }

    function render() {
      const tabsEl = document.getElementById("programs-tabs");
      tabsEl.innerHTML = menuData.programs.map(p => {
        const title = lang === "ru" ? p.title_ru : p.title_uz;
        const activeClass = p.id === currentProgram ? "active" : "";
        return `<button class="prog-btn ${activeClass}" onclick="selectProgram('${p.id}')">${title}</button>`;
      }).join("");

      const progObj = menuData.programs.find(p => p.id === currentProgram);
      const infoEl = document.getElementById("program-info");
      const isBusinessLunch = currentProgram === "Бизнес-ланч";

      if (progObj) {
        const title = lang === "ru" ? progObj.title_ru : progObj.title_uz;
        const desc = lang === "ru" ? progObj.desc_ru : progObj.desc_uz;
        const tiers = progObj.tiers || [];

        if (selectedTierIndex >= tiers.length) selectedTierIndex = 0;

        const tiersHtml = (!isBusinessLunch && tiers.length > 0) ? `
          <div class="kcal-label">${i18n[lang].chooseKcal}</div>
          <div class="tiers-grid">
            ${tiers.map((t, idx) => `
              <div class="tier-card ${idx === selectedTierIndex ? 'active' : ''}" onclick="selectTier(${idx})">
                <div class="tier-kcal">${t.kcal} ${i18n[lang].kcalUnit}</div>
                <div class="tier-price">${t.price}</div>
              </div>
            `).join("")}
          </div>
        ` : "";

        infoEl.innerHTML = `
          <div class="program-box">
            <div class="program-title">${title}</div>
            <div class="program-desc">${desc}</div>
            ${tiersHtml}
          </div>
        `;
      }

      document.getElementById("dishes-title").textContent = isBusinessLunch ? i18n[lang].lunchMenu : i18n[lang].menuExample;

      const dishesEl = document.getElementById("dishes-container");
      const filteredDishes = menuData.dishes.filter(d => d.program === currentProgram);

      dishesEl.innerHTML = filteredDishes.map(d => {
        const meal = lang === "ru" ? d.meal_ru : d.meal_uz;
        const name = lang === "ru" ? d.name_ru : d.name_uz;
        const desc = lang === "ru" ? d.desc_ru : d.desc_uz;
        const count = cart[d.id] || 0;

        const lunchControls = isBusinessLunch ? `
          <div class="dish-price-row">
            <span class="dish-price">${d.price || ""}</span>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${d.id}, -1)">−</button>
              <span class="qty-val">${count}</span>
              <button class="qty-btn" onclick="changeQty(${d.id}, 1)">+</button>
            </div>
          </div>
        ` : "";

        return `
          <div class="dish-card">
            <img class="dish-img" src="${d.img}" alt="${name}" onerror="this.src='https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400'" />
            <div class="dish-info">
              <div class="dish-meal">${meal}</div>
              <div class="dish-name">${name}</div>
              <div class="dish-desc">${desc}</div>
              ${lunchControls}
            </div>
          </div>
        `;
      }).join("");

      const orderBtn = document.getElementById("order-btn");
      if (isBusinessLunch) {
        const totalCount = Object.values(cart).reduce((a, b) => a + b, 0);
        orderBtn.textContent = totalCount > 0
          ? `${i18n[lang].orderLunch} (${totalCount})`
          : i18n[lang].selectLunchHint;
      } else {
        const tiers = (progObj && progObj.tiers) ? progObj.tiers : [];
        const activeTier = tiers[selectedTierIndex];
        const priceSuffix = activeTier ? ` • ${activeTier.price}` : "";
        orderBtn.textContent = `${i18n[lang].orderProgram}${priceSuffix}`;
      }
    }

    function submitOrder() {
      const isBusinessLunch = currentProgram === "Бизнес-ланч";
      let orderText = "";

      if (isBusinessLunch) {
        const items = Object.entries(cart).map(([id, qty]) => {
          const dish = menuData.dishes.find(d => d.id == id);
          return dish ? `${dish.name_ru} x${qty} (${dish.price})` : "";
        }).filter(Boolean);

        if (items.length === 0) {
          tg.showAlert(lang === "ru" ? "Выберите хотя бы одно блюдо для бизнес-ланча!" : "Kamida bitta taom tanlang!");
          return;
        }
        orderText = `Заказ (Бизнес-ланч):\n` + items.join("\n");
      } else {
        const progObj = menuData.programs.find(p => p.id === currentProgram);
        const activeTier = progObj.tiers[selectedTierIndex];
        orderText = `Программа: ${progObj.title_ru}\nКалорийность: ${activeTier.kcal} ккал\nСтоимость: ${activeTier.price}`;
      }

      const username = "OKSFOOD_manager";
      const url = `https://t.me/${username}?text=${encodeURIComponent("Здравствуйте! Хочу оформить заказ в OKS-FOOD:\n" + orderText)}`;
      tg.openTelegramLink(url);
    }

    loadMenu();
  </script>
</body>
</html>
