        }

        }

        <div class="max-w-md mx-auto">

                <div class="inline-flex rounded-xl bg-stone-200/80 dark:bg-slate-800 p-1 border border-stone-300 dark:border-slate-700">
                    <button id="lang-ru" onclick="setLang('ru')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition">RU</button>
                    <button id="lang-uz" onclick="setLang('uz')" class="px-2.5 py-1 rounded-lg text-xs font-bold transition">UZ</button>
                </div>

                    <span id="theme-icon">☀️</span>
                    <span id="theme-label">Светлая</span>
                </button>
            </div>

            <div class="flex flex-col items-center justify-center text-center">
                <div class="flex items-center gap-3 logo-glow mb-1">
                    <img src="logo.png" alt="OKS-FOOD Logo" class="w-14 h-14 object-contain rounded-2xl border border-emerald-500/30 bg-stone-100 dark:bg-slate-800 p-1 shadow-md" onerror="this.style.display='none'">
                    <h1 class="text-3xl font-black tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-emerald-600 via-teal-500 to-emerald-600 dark:from-emerald-400 dark:via-teal-300 dark:to-emerald-500">OKS-FOOD</h1>
                </div>
                <p id="header-subtitle" class="text-xs text-stone-500 dark:text-slate-400 tracking-wide mb-3">Премиальное сбалансированное питание с доставкой</p>
                <a href="https://t.me/oks_fooduz" target="_blank" onclick="openChannel(event)" class="inline-flex items-center gap-2 text-xs font-bold bg-emerald-500/15 hover:bg-emerald-500/25 text-emerald-700 dark:text-emerald-300 border border-emerald-500/30 px-4 py-2 rounded-full transition">
                    <span id="channel-btn-text">📢 Канал с меню (@oks_fooduz)</span>
                    <span>➔</span>
                </a>
            </div>
        </div>
    </header>

            </div>
        </div>

        <!-- Шаг 2: Выбор калорийности и КБЖУ -->
        <div id="tiers-section" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-white dark:bg-slate-800/90 border border-stone-200 dark:border-slate-700 p-4 rounded-2xl shadow-md">
                <div>
                    <span id="selected-tariff-label" class="text-[11px] text-emerald-600 dark:text-emerald-400 font-bold uppercase tracking-wider">Выбранный тариф:</span>
                    <h2 id="selected-program-title" class="text-lg font-extrabold text-slate-900 dark:text-white"></h2>
                </div>
                <button onclick="backToPrograms()" class="text-xs font-bold bg-stone-100 hover:bg-stone-200 dark:bg-slate-700 dark:hover:bg-slate-600 px-3 py-2 rounded-xl transition border border-stone-300 dark:border-slate-600 text-slate-700 dark:text-slate-200">

                </div>

                    Отправить менеджеру 🚀

        function applyTheme(theme) {
            currentTheme = theme;
            localStorage.setItem("oks_theme", theme);
            const root = document.documentElement;
            if (theme === "dark") {
                root.classList.add("dark");
            } else {
                root.classList.remove("dark");
            }
            updateStaticTexts();
        }

        function toggleTheme() {
            applyTheme(currentTheme === "dark" ? "light" : "dark");
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem("oks_lang", lang);
            document.documentElement.lang = lang;
            updateStaticTexts();
            renderPrograms();
            if (selectedProgram) {
                renderTiers(selectedProgram);

            document.getElementById("cust-name").placeholder = t.placeholderName;
            document.getElementById("label-phone").innerText = t.labelPhone;
            document.getElementById("label-address").innerText = t.labelAddress;
            document.getElementById("cust-address").placeholder = t.placeholderAddress;
            document.getElementById("label-geo").innerText = t.labelGeo;
            document.getElementById("cust-geo").placeholder = t.placeholderGeo;
            document.getElementById("geo-btn").innerText = t.geoBtn;
            document.getElementById("submit-order-btn").innerText = t.submitBtn;
        }

        function getProgramTitle(prog) {
            return currentLang === "uz" ? (prog.title_uz || prog.title_ru) : (prog.title_ru || prog.title_uz);
        }

        function getProgramDesc(prog) {
            return currentLang === "uz" ? (prog.desc_uz || prog.desc_ru) : (prog.desc_ru || prog.desc_uz);
        }

        function getKbjuStruct(progId, kcalValue) {
            const cleanKcal = String(kcalValue || "").replace(/ккал/gi, "").trim();
            const map = KBJU_STRUCT[progId] || KBJU_STRUCT[progId?.split(" ")[0]] || {};
            return map[kcalValue] || map[cleanKcal] || null;
        }

        function formatKbjuText(kbjuObj) {
            if (!kbjuObj) return "";
            const t = I18N[currentLang];
            return `${t.proteinShort}: ${kbjuObj.p} • ${t.fatShort}: ${kbjuObj.f} • ${t.carbsShort}: ${kbjuObj.c}`;
        }

        function openChannel(event) {
            if (tg && tg.openTelegramLink) {
                event.preventDefault();
                tg.openTelegramLink(CHANNEL_URL);
            }
        }

        async function fetchMenu() {
            document.getElementById("loading-text").innerText = I18N[currentLang].loading;
            try {
                const res = await fetch(`${BACKEND_URL}/api/menu`);
                const data = await res.json();
                menuData = data.programs || [];
                renderPrograms();
            } catch (err) {
                const t = I18N[currentLang];
                document.getElementById("programs-container").innerHTML = `
                    <div class="text-center py-8 bg-red-100/80 dark:bg-red-950/40 border border-red-300 dark:border-red-900/50 rounded-2xl p-4">
                        <p class="text-red-700 dark:text-red-400 text-sm font-bold">${t.loadErrorTitle}</p>
                        <p class="text-xs text-stone-600 dark:text-slate-400 mt-1">${t.loadErrorSub}</p>
                    </div>`;
            }
        }

        function renderPrograms() {
            const container = document.getElementById("programs-container");
            if (!menuData.length) return;
            const t = I18N[currentLang];
            container.innerHTML = "";

            menuData.forEach(prog => {
                const card = document.createElement("div");
                card.className = "bg-white dark:bg-slate-900/85 border border-stone-200 dark:border-slate-800 hover:border-emerald-500 p-4 rounded-2xl shadow-md cursor-pointer transition-all group";
                card.onclick = () => selectProgram(prog.id);
                card.innerHTML = `
                    <div class="flex justify-between items-start gap-2">
                        <h3 class="text-base font-extrabold text-slate-900 dark:text-white group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition">${getProgramTitle(prog)}</h3>
                        <span class="text-xs bg-emerald-500/15 text-emerald-700 dark:text-emerald-400 px-2.5 py-1 rounded-full font-bold border border-emerald-500/25 shrink-0">${t.selectBadge}</span>
                    </div>
                    <p class="text-xs text-stone-600 dark:text-slate-400 mt-2 leading-relaxed">${getProgramDesc(prog)}</p>
                `;
                container.appendChild(card);
            });
        }

        function selectProgram(progId) {
            selectedProgram = menuData.find(p => p.id === progId);
            selectedTier = null;

            document.getElementById("order-bar").classList.add("hidden");
            document.getElementById("programs-section").classList.add("hidden");
            document.getElementById("tiers-section").classList.remove("hidden");

            renderTiers(selectedProgram);
        }

        function renderTiers(prog) {
            const t = I18N[currentLang];
            document.getElementById("selected-program-title").innerText = getProgramTitle(prog);
            const container = document.getElementById("tiers-container");
            container.innerHTML = "";

            prog.tiers.forEach(tier => {
                const kbjuObj = getKbjuStruct(prog.id, tier.kcal);
                const isSelected = selectedTier && selectedTier.kcal === tier.kcal && selectedTier.price === tier.price;

                const btn = document.createElement("button");
                btn.className = `w-full text-left p-4 rounded-2xl transition-all border shadow-md group ${
                    isSelected
                        ? "border-emerald-500 bg-emerald-50/80 dark:bg-slate-800"
                        : "border-stone-200 dark:border-slate-800 bg-white dark:bg-slate-900/85 hover:border-emerald-500/50"
                }`;
                btn.onclick = () => selectTier(tier, kbjuObj, btn);

                const kbjuBlock = kbjuObj ? `
                    <div class="grid grid-cols-3 gap-2 mt-3 pt-3 border-t border-stone-200/80 dark:border-slate-800">
                        <div class="bg-stone-100 dark:bg-slate-800/90 rounded-xl px-2.5 py-2 text-center">
                            <div class="text-[11px] font-semibold text-stone-500 dark:text-slate-400">${t.proteinShort}</div>
                            <div class="text-sm font-extrabold text-slate-900 dark:text-white mt-0.5">${kbjuObj.p}</div>
                        </div>
                        <div class="bg-stone-100 dark:bg-slate-800/90 rounded-xl px-2.5 py-2 text-center">
                            <div class="text-[11px] font-semibold text-stone-500 dark:text-slate-400">${t.fatShort}</div>
                            <div class="text-sm font-extrabold text-slate-900 dark:text-white mt-0.5">${kbjuObj.f}</div>
                        </div>
                        <div class="bg-stone-100 dark:bg-slate-800/90 rounded-xl px-2.5 py-2 text-center">
                            <div class="text-[11px] font-semibold text-stone-500 dark:text-slate-400">${t.carbsShort}</div>
                            <div class="text-sm font-extrabold text-slate-900 dark:text-white mt-0.5">${kbjuObj.c}</div>
                        </div>
                    </div>
                ` : "";

                btn.innerHTML = `
                    <div class="flex justify-between items-center gap-3">
                        <div>
                            <div class="text-[11px] font-bold text-stone-500 dark:text-slate-400 uppercase tracking-wider">${t.kcalLabel}</div>
                            <div class="font-extrabold text-slate-900 dark:text-white text-base mt-0.5 group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition">🔥 ${tier.kcal}</div>
                        </div>
                        <div class="text-right shrink-0">
                            <div class="text-[11px] font-bold text-stone-500 dark:text-slate-400 uppercase tracking-wider">${t.priceLabel}</div>
                            <div class="text-emerald-600 dark:text-emerald-400 font-black text-base mt-0.5">${tier.price}</div>
                        </div>
                    </div>
                    ${kbjuBlock}
                `;
                container.appendChild(btn);
            });
        }

        function selectTier(tier, kbjuObj, btnElement) {
            document.querySelectorAll("#tiers-container button").forEach(b => {
                b.classList.remove("border-emerald-500", "bg-emerald-50/80", "dark:bg-slate-800");
                b.classList.add("border-stone-200", "dark:border-slate-800", "bg-white", "dark:bg-slate-900/85");
            });
            btnElement.classList.remove("border-stone-200", "dark:border-slate-800", "bg-white", "dark:bg-slate-900/85");
            btnElement.classList.add("border-emerald-500", "bg-emerald-50/80", "dark:bg-slate-800");

            selectedTier = { ...tier, kbjuObj };
            updateOrderSummary();
            document.getElementById("order-bar").classList.remove("hidden");
        }

        function updateOrderSummary() {
            if (!selectedProgram || !selectedTier) return;
            const progTitle = getProgramTitle(selectedProgram);
            document.getElementById("selected-summary").innerText = `${progTitle} | ${selectedTier.kcal} — ${selectedTier.price}`;
            document.getElementById("modal-tariff-info").innerText = `${progTitle} • ${selectedTier.kcal} (${selectedTier.price})`;
        }

        function backToPrograms() {
            selectedProgram = null;
            selectedTier = null;
            document.getElementById("tiers-section").classList.add("hidden");
            document.getElementById("programs-section").classList.remove("hidden");
            document.getElementById("order-bar").classList.add("hidden");
        }

        function openOrderModal() {
            if (!selectedProgram || !selectedTier) return;
            updateOrderSummary();

            const user = tg?.initDataUnsafe?.user;
            const nameInput = document.getElementById("cust-name");
            if (user && !nameInput.value) {
                nameInput.value = [user.first_name, user.last_name].filter(Boolean).join(" ");
            }

            document.getElementById("order-modal").classList.remove("hidden");
        }

        function closeOrderModal() {
            document.getElementById("order-modal").classList.add("hidden");
        }

        function detectLocation() {
            const t = I18N[currentLang];
            const btn = document.getElementById("geo-btn");
            const geoInput = document.getElementById("cust-geo");

            if (!navigator.geolocation) {
                alert(t.geoUnsupported);
                return;
            }

            btn.innerText = t.geoSearching;
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    const lat = pos.coords.latitude.toFixed(6);
                    const lon = pos.coords.longitude.toFixed(6);
                    geoInput.value = `https://maps.google.com/?q=${lat},${lon}`;
                    btn.innerText = t.geoReady;
                    btn.disabled = false;
                },
                () => {
                    alert(t.geoError);
                    btn.innerText = t.geoBtn;
                    btn.disabled = false;
                },
                { enableHighAccuracy: true, timeout: 10000 }
            );
        }

        function submitOrderForm(event) {
            event.preventDefault();
            if (!selectedProgram || !selectedTier) return;

            const t = I18N[currentLang];
            const progTitle = getProgramTitle(selectedProgram);
            const name = document.getElementById("cust-name").value.trim();
            const phone = document.getElementById("cust-phone").value.trim();
            const address = document.getElementById("cust-address").value.trim();
            const geo = document.getElementById("cust-geo").value.trim();
            const kbjuFormatted = formatKbjuText(selectedTier.kbjuObj);
            const kbjuLine = kbjuFormatted ? `\n📊 ${t.msgKbju}: ${kbjuFormatted}` : "";

            const text =
                `${t.msgGreeting}\n\n` +
                `📦 ${t.msgTariff}: ${progTitle}\n` +
                `🔥 ${t.msgKcal}: ${selectedTier.kcal}${kbjuLine}\n` +
                `💰 ${t.msgPrice}: ${selectedTier.price}\n\n` +
                `👤 ${t.msgName}: ${name}\n` +
                `📞 ${t.msgPhone}: ${phone}\n` +
                `🏠 ${t.msgAddress}: ${address}\n` +
                `📍 ${t.msgGeo}: ${geo}\n\n` +
                `⚠️ ${t.msgReceiptNote}\n` +
                `${t.msgMenuRequest}`;

            const url = `https://t.me/${MANAGER_USERNAME}?text=${encodeURIComponent(text)}`;

            closeOrderModal();

            if (tg && tg.openTelegramLink) {
                tg.openTelegramLink(url);
            } else {
                window.open(url, "_blank");
            }
        }

        applyTheme(currentTheme);
        setLang(currentLang);
        fetchMenu();
    </script>
</body>
</html>
